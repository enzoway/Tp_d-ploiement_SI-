<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Accueil - Supervision Automates</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e5e7eb;
      flex-direction: column;
    }

    .card {
      background: #111827;
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid #1f2937;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: #e5e7eb;
    }

    input, select {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 0.6rem;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px #38bdf8;
      background: #020617;
    }

    .field {
      margin-bottom: 1.2rem;
    }

    .help-text {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 0.2rem;
    }

    button {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 999px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #0b1120;
      margin-top: 0.5rem;
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.2s;
    }

    button:hover {
      filter: brightness(1.05);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 5px 14px rgba(56, 189, 248, 0.3);
    }

    .error {
      margin-top: 0.75rem;
      color: #f97373;
      font-size: 0.85rem;
      min-height: 1.1em;
      text-align: center;
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: center;
    }

    /* Indicateur API */
    .api-status {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 99px;
      background: #1f2937;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #374151;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.ok {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
  </style>
</head>
<body>
  <div class="api-status">
    <div id="api-dot" class="status-dot"></div>
    <span id="api-text">Connexion serveur...</span>
  </div>

  <main class="card">
    <h1>Portail opérateur</h1>
    <p class="subtitle">
      Sélectionnez votre type d’opérateur puis entrez votre matricule.
    </p>

    <form id="operator-form">
      <!-- Type d’opérateur -->
      <div class="field">
        <label for="operator-type">Type d’opérateur</label>
        <select id="operator-type" name="operator-type" required>
          <option value="">— Sélectionner —</option>
          <option value="1">1 — Opérateur de surveillance</option>
          <option value="2">2 — Opérateur modification / réglage</option>
        </select>
      </div>

      <!-- Matricule -->
      <div class="field">
        <label for="matricule">Numéro de matricule</label>
        <input
          type="text"
          id="matricule"
          name="matricule"
          placeholder="Ex : 12345"
          required
        />
        <p class="help-text">
          Votre matricule sera utilisé pour personnaliser l’interface.
        </p>
      </div>

      <!-- Bouton -->
      <button type="submit">Continuer</button>

      <!-- Zone d’erreur -->
      <div id="error-message" class="error"></div>
    </form>

    <p class="footer">
      Projet de supervision open source – Hackathon industriel
    </p>
  </main>

  <script>
    // --- VÉRIFICATION AUTOMATIQUE DE L'API ---
    // Fonction robuste pour déterminer l'adresse du Backend
    function getApiUrl() {
        // Cas 1 : Si on ouvre le fichier localement (double-clic)
        if (window.location.protocol === 'file:') {
            return 'http://localhost:3002/api';
        }
        // Cas 2 : Si on est hébergé (Docker, Nginx, Live Server)
        // On reprend l'IP de la barre d'adresse automatiquement
        return 'http://' + window.location.hostname + ':3002/api';
    }

    const API_URL = getApiUrl();
    
    async function checkApi() {
        const dot = document.getElementById('api-dot');
        const text = document.getElementById('api-text');
        try {
            await fetch(`${API_URL}/automates`);
            dot.classList.add('ok');
            text.textContent = "API Connectée (3002)";
            text.style.color = "#4ade80";
            return true;
        } catch (e) {
            dot.classList.remove('ok');
            text.textContent = "Serveur éteint ❌";
            text.style.color = "#f87171";
            console.error("Erreur API:", e);
            return false;
        }
    }
    // Lancer la vérif au chargement
    checkApi();

    // --- GESTION DU FORMULAIRE ---
    const form = document.getElementById("operator-form");
    const errorBox = document.getElementById("error-message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      errorBox.textContent = "";

      const type = document.getElementById("operator-type").value.trim();
      const matricule = document.getElementById("matricule").value.trim();

      if (!type || !matricule) {
        errorBox.textContent = "Veuillez remplir tous les champs.";
        return;
      }

      if (!/^[0-9]+$/.test(matricule)) {
        errorBox.textContent = "Le matricule doit contenir uniquement des chiffres.";
        return;
      }

      // On revérifie la connexion avant de partir
      const apiOk = await checkApi();
      if (!apiOk) {
        errorBox.textContent = "Impossible de se connecter au serveur (Port 3002).";
        return;
      }

      let targetPage = type === "1" ? "surveillance.html" : "modification.html";
      const url = `${targetPage}?matricule=${encodeURIComponent(matricule)}`;
      window.location.href = url;
    });
  </script>
</body>
</html>
